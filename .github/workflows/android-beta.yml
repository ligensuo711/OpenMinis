name: Android Beta Build

# Builds the Android APK on GitHub's runners because the phone itself has no
# Android SDK. Mirrors BUILDING.md:
#   native deps (proot + loaders, Alpine rootfs, rclone aar) -> Gradle.
#
# NOTE on the SDK: ubuntu-24.04 ships Android cmdline-tools 16.0, and
# android-actions/setup-android@v3 then tries to install the legacy "tools"
# package, which no longer exists -> "Failed to find package 'tools'". We
# therefore use the pre-installed SDK directly instead of that action.
#
# Signing: when the CI_KEYSTORE_* secrets are present the APK is signed with
# that keystore so it installs OVER an existing install with the same
# certificate (an uninstall would wipe sessions, providers and the sandbox
# rootfs). Absent the secrets, the build falls back to debug signing.

on:
  workflow_dispatch:
  push:
    branches: [revprompt]

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Go (for gomobile/rclone)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Resolve Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at $SDK"
          ls "$SDK" || true
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -d "$SDK/cmdline-tools/16.0/bin" ]; then
            echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          else
            echo "cmdline-tools not found — installing"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "ndk;28.0.12433566" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.12433566" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/28.0.12433566" >> "$GITHUB_ENV"

      - name: Export Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Provider customization placeholder
        # The public tree only ships the .example template. Empty values
        # compile fine, but anything touching the Claude OAuth path throws by
        # design, so a CI-only placeholder keeps every code path reachable.
        run: |
          cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties
          sed -i 's|^ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=$|ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=ci-placeholder-not-a-real-identifier|' src/android/app/provider-customization.properties
          grep ANTHROPIC_OAUTH_IDENTIFIER_PROMPT src/android/app/provider-customization.properties

      - name: Decode signing keystore (optional)
        env:
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
          KS_STORE_PW: ${{ secrets.CI_KEYSTORE_STORE_PW }}
          KS_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.CI_KEYSTORE_KEY_PW }}
        if: ${{ env.CI_KEYSTORE_B64 != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          printf '%s' "$CI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks/minis-release.jks"
          {
            echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/ks/minis-release.jks"
            printf 'CI_KEYSTORE_STORE_PW=%s\n' "$KS_STORE_PW"
            printf 'CI_KEYSTORE_KEY_ALIAS=%s\n' "$KS_KEY_ALIAS"
            printf 'CI_KEYSTORE_KEY_PW=%s\n' "$KS_KEY_PW"
          } >> "$GITHUB_ENV"

      - name: Build proot + loaders
        run: bash deps/build_proot.sh

      - name: Prepare Alpine rootfs
        run: bash scripts/prepare_android_sandbox.sh

      - name: Build rclone AAR
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          bash deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          GRADLE_OPTS: -Xmx6g -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          cd src/android
          ./gradlew :app:assembleRelease -x lint --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp src/android/app/build/outputs/apk/release/*.apk out/ || true
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minis-revprompt-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload native debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minis-native-symbols
          path: src/android/app/build/outputs/native-debug-symbols/**/*.zip
          if-no-files-found: ignore
