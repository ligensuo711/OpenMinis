name: Build Android release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init proot submodule
        # Android-only tree: proot is the sole sandbox kernel submodule.
        run: git submodule update --init --recursive deps/proot

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;34.0.0" "ndk;28.0.12433566" "cmake;3.22.1"

      - name: Configure NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Prepare provider customization
        # The public tree ships only the .example template (empty values). Tests
        # that touch the Claude OAuth path read ANTHROPIC_OAUTH_IDENTIFIER_PROMPT
        # and the getter throws by design when it is empty, so inject a CI-only
        # placeholder. No test asserts the literal value — it only has to be
        # non-empty. Release APKs built here therefore carry a placeholder, not a
        # real identifier: sign in with an API key, or build locally with your own
        # provider-customization.properties to use Claude Code OAuth.
        run: |
          cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties
          sed -i 's|^ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=$|ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=ci-placeholder-not-a-real-identifier|' src/android/app/provider-customization.properties
          grep ANTHROPIC_OAUTH_IDENTIFIER_PROMPT src/android/app/provider-customization.properties

      - name: Build proot native deps
        run: bash deps/build_proot.sh

      - name: Build rclone aar (gomobile binding)
        # deps/build_rclone_android.sh outputs deps/build/rclone/rclone.aar;
        # app/build.gradle.kts expects it at app/libs/rclone.aar.
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          bash deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar

      - name: Prepare Alpine rootfs
        run: bash scripts/prepare_android_sandbox.sh

      - name: Decode signing keystore
        run: echo "${{ secrets.MINIS_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/minis-release.jks"

      - name: Run JVM unit tests (gate — build aborts on any failure)
        run: |
          cd src/android
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK (R8 + AOT-friendly, persistent signature)
        env:
          MINIS_KEYSTORE_PATH: ${{ runner.temp }}/minis-release.jks
          MINIS_KEYSTORE_PASSWORD: ${{ secrets.MINIS_KEYSTORE_PASSWORD }}
          MINIS_KEY_ALIAS: ${{ secrets.MINIS_KEY_ALIAS }}
          MINIS_KEY_PASSWORD: ${{ secrets.MINIS_KEY_PASSWORD }}
        run: |
          cd src/android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minis-release-apk
          path: |
            src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error